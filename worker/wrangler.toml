# 습관 퀘스트 푸시 서버 (Cloudflare Workers 무료 플랜 안에서 동작)
# 배포 방법은 README.md 참고
name = "habit-quest-push"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 매 분 실행: 예정 시각부터 10분 안에 보낼 알림을 고른다
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# 앱 주소, 하위 경로까지 끝에 / 포함 (CORS 허용 출처, 알림을 눌렀을 때 열 주소)
APP_URL = "https://REPLACE.github.io/habit-quest/"
# 푸시 서비스가 문제 있을 때 연락할 주소 (VAPID sub)
VAPID_SUBJECT = "mailto:REPLACE@example.com"
# node scripts/vapid.mjs 로 만든 공개키 (앱 VITE_VAPID_PUBLIC_KEY 와 같은 값)
VAPID_PUBLIC_KEY = "REPLACE"

# 시크릿 (wrangler secret put 으로 넣는다, 이 파일에 쓰지 않는다)
# VAPID_PRIVATE_KEY  node scripts/vapid.mjs 로 만든 개인키 (base64url)
# API_TOKEN          앱이 서버에 쓸 때 쓰는 토큰 (앱 VITE_PUSH_API_TOKEN 과 같은 값)
# CAL_TOKEN          캘린더 구독 주소에 들어가는 비밀 문자열
